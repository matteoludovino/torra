# Render Blueprint (free plan). Create it from the dashboard: New > Blueprint > this repository.
# PostgreSQL is external (Neon free plan).
services:
  - type: web
    name: torra-api
    runtime: docker
    plan: free # sleeps after 15 min without traffic; the first request wakes it (~40-60 s)
    region: virginia # next to the Neon database (aws-us-east-1)
    dockerContext: . # the image bundles packages/shared too
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon pooled connection string (host with "-pooler"), ?sslmode=require
      - key: DIRECT_DATABASE_URL
        sync: false # Neon direct connection string (no "-pooler"): used by migrations
      - key: WEB_ORIGINS
        sync: false # the Vercel URL (Origin checks)
      - key: TRUST_PROXY
        value: "true" # behind Render's proxy and the web app's rewrite: real client addresses for limits
      - key: WEB_URL
        sync: false # the Vercel URL, for links in emails
      - key: SMTP_URL
        sync: false # optional: without it, emails are kept in the database (sent_emails)
      - key: SIGNING_SECRET
        generateValue: true # signs unsubscribe links; Render makes a random one, never in the repository
      # Stripe in test mode (live keys are refused by the API), from the production Stripe sandbox:
      # Developers > API keys, and the webhook endpoint https://<this service>/api/payments/webhook
      # (API version 2026-10-28.endive; events payment_intent.*, charge.refunded, refund.*,
      # charge.dispute.*), whose signing secret goes in STRIPE_WEBHOOK_SECRET.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENTS_ENV
        value: production # written on every Stripe object, to tell deployments apart
